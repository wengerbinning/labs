<template>
    <div class="login-wrapper">
      <div class="login-box">
        <!-- Header -->
        <div class="login-header">
          <h2>Welcome Back</h2>
          <p>Please sign in to your account</p>
        </div>

        <!-- Login Form -->
        <form @submit.prevent="handleLogin" class="login-form">
          <!-- Email Input -->
          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">📧</span>
              <input
                id="email"
                v-model="form.email"
                type="email"
                placeholder="Enter your email"
                :class="['form-control', { 'error': v$.email.$errors.length }]"
                @blur="v$.email.$touch()"
              />
            </div>
            <div v-if="v$.email.$errors.length" class="error-message">
              {{ v$.email.$errors[0].$message }}
            </div>
          </div>

          <!-- Password Input -->
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input
                id="password"
                v-model="form.password"
                :type="showPassword ? 'text' : 'password'"
                placeholder="Enter your password"
                :class="['form-control', { 'error': v$.password.$errors.length }]"
                @blur="v$.password.$touch()"
              />
              <button
                type="button"
                class="password-toggle"
                @click="togglePassword"
              >
                {{ showPassword ? 'Hide' : 'Show' }}
              </button>
            </div>
            <div v-if="v$.password.$errors.length" class="error-message">
              {{ v$.password.$errors[0].$message }}
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" v-model="form.remember" />
              <span>Remember me</span>
            </label>
            <router-link to="/forgot-password" class="forgot-link">
              Forgot password?
            </router-link>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="login-button"
            :disabled="isLoading"
          >
            <span v-if="isLoading" class="spinner"></span>
            {{ isLoading ? 'Signing in...' : 'Sign In' }}
          </button>

          <!-- Alert Messages -->
          <transition name="fade">
            <div v-if="errorMessage" class="alert alert-error">
              {{ errorMessage }}
            </div>
          </transition>

          <transition name="fade">
            <div v-if="successMessage" class="alert alert-success">
              {{ successMessage }}
            </div>
          </transition>

          <!-- Sign Up Link -->
          <div class="signup-prompt">
            Don't have an account?
            <router-link to="/register" class="signup-link">
              Sign up
            </router-link>
          </div>
        </form>
      </div>
    </div>
  </template>

  <script setup>
  import { ref, reactive, computed } from 'vue'
  import { useVuelidate } from '@vuelidate/core'
  import { required, email, minLength } from '@vuelidate/validators'
  import { useRouter } from 'vue-router'

  // Router
  const router = useRouter()

  // Form state
  const form = reactive({
    email: '',
    password: '',
    remember: false
  })

  // UI state
  const showPassword = ref(false)
  const isLoading = ref(false)
  const errorMessage = ref('')
  const successMessage = ref('')

  // Validation rules
  const rules = {
    email: { required, email },
    password: { required, minLength: minLength(6) }
  }

  const v$ = useVuelidate(rules, form)

  // Toggle password visibility
  const togglePassword = () => {
    showPassword.value = !showPassword.value
  }

  // Form validity
  const isFormValid = computed(() => {
    return !v$.value.$invalid
  })

  // Handle login submission
  const handleLogin = async () => {
    // Validate form
    v$.value.$touch()
    if (v$.value.$invalid) {
      errorMessage.value = 'Please fix the form errors'
      return
    }

    isLoading.value = true
    errorMessage.value = ''
    successMessage.value = ''

    try {
      // Simulate API call
      await new Promise(resolve => setTimeout(resolve, 1500))

      // Mock successful login
      if (form.email === 'demo@example.com' && form.password === 'password123') {
        successMessage.value = 'Login successful! Redirecting...'

        // Store auth token (example)
        localStorage.setItem('auth_token', 'demo-token-123')

        if (form.remember) {
          localStorage.setItem('remember_email', form.email)
        }

        // Redirect after 2 seconds
        setTimeout(() => {
          router.push('/dashboard')
        }, 2000)
      } else {
        throw new Error('Invalid email or password')
      }
    } catch (error) {
      errorMessage.value = error.message || 'Login failed. Please try again.'
    } finally {
      isLoading.value = false
    }
  }

  // Load remembered email on mount
  const loadRememberedEmail = () => {
    const remembered = localStorage.getItem('remember_email')
    if (remembered) {
      form.email = remembered
      form.remember = true
    }
  }

  loadRememberedEmail()
  </script>
