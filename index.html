<!DOCTYPE html>
<html>
<head>
	<title>列表演示</title>

<style>
:root {
	--primary: #3498db;
	--secondary: #2ecc71;
	--accent: #e74c3c;
	--dark: #2c3e50;
	--light: #ecf0f1;
	--gray: #95a5a6;
}

* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
	background-color: #f5f7fa;
	color: #333;
	line-height: 1.6;
}


/*  */
.board {
	background-color: aquamarine;
}

.board-menu {
	background-color: brown;
}

.board-list {
	background-color:black;
}

.board-stat {
	background-color:blueviolet;
}


</style>
</head>


<body>
<!--  -->
<div class="board">
	<div class="board-menu"> A </div>
	<div class="board-list"> B </div>
	<div class="board-stat"> C </div>
</div>

</body>
</html>
