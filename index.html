<!DOCTYPE html>
<head>
	<title>表格</title>

	<link rel="stylesheet" href="index.css">
	<script src="index.js" defer></script>
</head>


<body>
	<table>
		<caption>标题</caption>
		<colgroup>
			<col style="width: 5%;">      <!-- 第1列：百分比 -->
			<col style="width: 100px;">    <!-- 第2列：固定像素 -->
			<col style="width: 15%;">      <!-- 第3列：百分比 -->
			<col style="width: 200px;">    <!-- 第4列：固定像素 -->
			<col style="width: auto;">     <!-- 第5列：自适应 -->
		</colgroup>
		<thead>
			<tr>
				<th scope="col" rowspan="2">名称</th>
				<th scope="colgroup" colspan="4">类型</th>
				<th scope="col" rowspan="2">说明</th>
			</tr>
			<tr>
				<th scope="col">uci</th>
				<th scope="col">type</th>
				<th scope="col">default</th>
				<th scope="col">optional</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<th scope="row">A</th>
				<td>option</td>
				<td>number</td>
				<td>0</td>
				<td>false</td>
			</tr>
		</tbody>
		<tfoot>
			<tr>
				<th scope="row">总计</th>
				<td>1</td>
			</tr>
		</tfoot>
	</table>
</body>
</html>
