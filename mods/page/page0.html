<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>列表演示</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<style>
		:root {
			--flex-primary: #3498db;
			--flex-secondary: #2980b9;
			--grid-primary: #2ecc71;
			--grid-secondary: #27ae60;
			--dark: #2c3e50;
			--light: #ecf0f1;
			--gray: #95a5a6;
			--warning: #e74c3c;
			--success: #2ecc71;
			--info: #3498db;
		}
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;

			text-align: center;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}
		html body {
			width: 100%;
			height: 100%;
		}

		#page-center {
			width: 100%;
			height: 100%;

			display: flex;
			align-items: center;
			flex-direction: column;
			justify-content: space-between;
		}

		#page-list {
			height: 100%;
			flex-grow: 1;
			border: 1px solid;
		}
		#page-info {
			height: 100%;
			flex-grow: 8;
		}
		#page-stat {
			height: 100%;
			flex-grow: 1;
			border: 1px solid;
		}
	</style>
</head>

<body>
	<div id="page-center">
		<div id="page-list"> A </div>
		<div id="page-info"> B </div>
		<div id="page-stat"> C </div>
	</div>
</body>
</html>
