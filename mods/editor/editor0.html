<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>文本编辑器</title>

	<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
	<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

	<link rel="stylesheet" href="index.css">
	<script src="index.js" defer></script>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;

			/* text-align: center; */
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}

		html {
			width: 100%;
			height: 100%;
		}

		body {
			width: 100%;
			height: 100%;
		}
		#page-center {
			width: 100%;
			height: 100%;

			display: flex;
			align-items: center;
			flex-direction: row;
			justify-content: space-between;
		}
		#page-list {
			height: 100%;
			flex-grow: 1;
			border: 1px solid;
			text-align: center;
		}
		#page-info {
			height: 100%;

			flex-grow: 8;
		}
		#page-stat {
			height: 100%;
			flex-grow: 1;
			border: 1px solid;
			text-align: center;
		}
		.ql-tooltip {
			display: none !important;
		}
	</style>
</head>

<body>
	<div id="page-center">
		<div id="page-list"> A </div>
		<div id="page-info"> <div id="editor"></div> </div>
		<div id="page-stat"> C </div>
	</div>

				// [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
				// [{ 'color': [] }, { 'background': [] }],

</html>
