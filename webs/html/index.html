<!DOCTYPE html>
<html>

<head>
	<title>HTML Labs</title>
	<meta charset="utf-8"/>

<style>

body {
	margin: 0;
	padding: 0;
	/* backgroud */
	background-color: azure;

	/**/
	border: 1px solid black;

}


#header {
	height: 4%;
	width: 100%;
	border: 1px solid black;

	display: flex;
}

/*  */
#menu {
	border: 1px solid black;

	width: 40px;
	height: 40px;
}

#menu:hover {
	color: red;
}

/*  */
.menu-icon:before {
  content: '';
  position: absolute;
  top: -5px;
  left: 0;
  width: 17px;
  height: 2px;
  background-color: currentColor;
}

.menu-icon {
  color: #000;
  position: absolute;
  margin-left: 2px;
  margin-top: 10px;
  width: 17px;
  height: 2px;
  background-color: currentColor;
}

.menu-icon:after {
  content: '';
  position: absolute;
  top: 5px;
  left: 0;
  width: 17px;
  height: 2px;
  background-color: currentColor;
}

/*  */
#menu > #menu-main {
	display: none;
	border: 1px solid black;

	position: absolute;
	top: 40px;

	height: 100vh;
	width: 10vw;

	float: left;

	flex:auto;
}

#menu:hover > #menu-main {
	display: block;
}

#menu-main > div {
	border: 1px solid black;

	align-content: center;
}

#menu-main > div > p, #menu-main > div > div > p {
	text-align: center;
}

/*  */
.menu-class {
	border: 1px solid black;
	color: black;
}

.menu-class:hover {
	color: red;
}

.menu-content {
	border: 1px solid black;

	color: black;

	height: 100%;
	width: 10vw;

	position: absolute;
	top: 0px;
	left: 10vw;

	display: none;
}

.menu-class:hover > .menu-content {
	display: block;
}

.menu-content > div {
	border: 1px solid black;
}

.menu-content > div > p {
	text-align: center;
}



#main {
	height: 90%;
	width: 100%;
	border: 1px solid black;
}

#footer {
	border: 1px solid black;
}

</style>
</head>


<body>
	<div id="header">
		<div id="menu">
			<div class="menu-icon"></div>
			<div id="menu-main">
				<div class="menu-class">
					<div><p>A</p></div>
					<div class="menu-content">
						<div><p>A1</p></div>
						<div><p>A2</p></div>
						<div><p>A3</p></div>
					</div>
				</div>
				<div class="menu-class">
					<div><p>B</p></div>
					<div class="menu-content">
						<div><p>B1</p></div>
						<div><p>B2</p></div>
						<div><p>B3</p></div>
					</div>
				</div>
				<div class="menu-class">
					<div><p>C</p></div>
					<div class="menu-content">
						<div><p>C1</p></div>
						<div><p>C2</p></div>
						<div><p>C3</p></div>
					</div>
				</div>
				<div class="menu-class">
					<div><p>D</p></div>
					<div class="menu-content">
						<div><p>D1</p></div>
						<div><p>D2</p></div>
						<div><p>D3</p></div>
					</div>
				</div>
				<div class="menu-class">
					<div><p>E</p></div>
					<div class="menu-content">
						<div><p>E1</p></div>
						<div><p>E2</p></div>
						<div><p>E3</p></div>
					</div>
				</div>
			</div>
		</div>
		<div id="icon">
			<p>Icon</p>
		</div>
		<div>
			<p>Header</p>
		</div>

	</div>
	<div id="main">
		<p>Content</p>
	</div>
</body>

</html>
