<!DOCTYPE html>
<html>
<head>
<title>HTML Table Labs</title>
</head>

<style>
table {
	border-collapse: collapse;
	border: 2px solid rgb(140 140 140);
	letter-spacing: 1px;

	font-family: sans-serif;
	font-size: 0.8rem;
}

caption {
	caption-side: bottom;
	padding: 10px;
}

th, td {
  border: 1px solid rgb(160 160 160);
  padding: 8px 6px;
}

td {
  text-align: center;
}


.batman {
  background-color: #d7d9f2;
}

.flash {
  background-color: #ffe8d4;
}
</style>



<body>

<table>
	<!-- Table comment  -->
	<caption> Table 1 - Example Table</caption>


	<colgroup>
		<col />
		<col span="2" class="batman" />
		<col span="2" class="flash" />
	  </colgroup>

	<!-- Table header -->
	<thead>
		<tr>
			<th scope="col">ID</th>
			<th scope="col">Name</th>
			<th scope="col">Label</th>
			<th scope="col">Comment</th>
		</tr>
	</thead>

	<!-- table body -->
	<tbody>
		<tr>
			<th scope="row">A</th>
			<td>Alpha A</th>
			<td>Aa</th>
			<td>word A</th>
		</tr>
		<tr>
			<th scope="row">B</th>
			<td>Alpha B</th>
			<td>Bb</th>
			<td>word B</th>
		</tr>
	</tbody>

	<!-- table footer -->
	<tfoot>
		<tr>
			<th scope="row">end</th>
			<td>Alphas</th>
			<td>end</th>
			<td>word end</th>
		</tr>
	</tfoot>

</table>





</body>
</html>
