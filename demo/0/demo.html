<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三栏 · 修复折叠功能</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            background: #f8fafc;
        }

        /* 左侧目录栏 (默认展开) */
        .sidebar-left {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid #e9eef2;
            display: flex;
            flex-direction: column;
            transition: width 0.25s cubic-bezier(0.2, 0, 0, 1);
            overflow: hidden;
            box-shadow: 2px 0 12px rgba(0,0,0,0.03);
        }

        .sidebar-left.collapsed {
            width: 56px;
        }

        .sidebar-left.collapsed .left-header span:not(.icon-wrapper):not(.fold-btn),
        .sidebar-left.collapsed .dir-content {
            opacity: 0;
            pointer-events: none;
        }

        /* 右侧展示栏 (默认展开) */
        .sidebar-right {
            width: 280px;
            background: #ffffff;
            border-left: 1px solid #e9eef2;
            display: flex;
            flex-direction: column;
            transition: width 0.25s cubic-bezier(0.2, 0, 0, 1);
            overflow: hidden;
            box-shadow: -2px 0 12px rgba(0,0,0,0.03);
        }

        .sidebar-right.collapsed {
            width: 56px;
        }

        .sidebar-right.collapsed .right-header span:not(.icon-wrapper):not(.fold-btn),
        .sidebar-right.collapsed .preview-content {
            opacity: 0;
            pointer-events: none;
        }

        /* 中央编辑区 — 自适应弹性 */
        .main-editor {
            flex: 1;
            background: #f9f9fc;
            display: flex;
            flex-direction: column;
            min-width: 240px;
        }

        /* 每个栏目的头部样式 */
        .left-header, .right-header, .editor-header {
            height: 60px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #eef2f6;
            background: #ffffff;
            font-weight: 500;
            color: #0f1825;
            flex-shrink: 0;
        }

        .editor-header {
            background: #ffffff;
            border-bottom: 1px solid #eef2f6;
            padding-left: 24px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            color: #1e2b3c;
        }

        /* ===== 精致线性图标 ===== */
        .icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            color: #4d5c6e;
            transition: all 0.2s ease;
        }

        /* 左侧目录图标 */
        .sidebar-left .header-title .icon-wrapper svg {
            width: 20px;
            height: 20px;
            stroke: #4d5c6e;
            stroke-width: 1.8;
            fill: none;
            transition: stroke 0.2s;
        }

        /* 右侧展示图标 */
        .sidebar-right .header-title .icon-wrapper svg {
            width: 20px;
            height: 20px;
            stroke: #4d5c6e;
            stroke-width: 1.8;
            fill: none;
            transition: stroke 0.2s;
        }

        /* 编辑区图标 */
        .editor-header .icon-wrapper svg {
            width: 20px;
            height: 20px;
            stroke: #3b6e9c;
            stroke-width: 1.8;
            fill: none;
        }

        .left-header:hover .icon-wrapper svg,
        .right-header:hover .icon-wrapper svg {
            stroke: #2563eb;
        }

        /* ===== 折叠图标 (三点式) ===== */
        .fold-btn {
            background: transparent;
            border: none;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.2s;
            /* 确保折叠按钮始终可见且可点击 */
            opacity: 1 !important;
            pointer-events: auto !important;
            z-index: 10;
        }

        .fold-btn:hover {
            background-color: #f0f4fa;
        }

        .icon-dots {
            display: flex;
            align-items: center;
            gap: 3px;
            transition: all 0.25s ease;
        }

        .icon-dots span {
            display: block;
            width: 4px;
            height: 4px;
            background-color: #4f6f8f;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .fold-btn:hover .icon-dots span {
            background-color: #2563eb;
        }

        .fold-btn:hover .icon-dots span:nth-child(2) {
            transform: scale(1.3);
        }

        /* 折叠状态：三点垂直排列 */
        .sidebar-left.collapsed .icon-dots,
        .sidebar-right.collapsed .icon-dots {
            flex-direction: column;
            gap: 4px;
        }

        /* 目录项样式 */
        .dir-content {
            padding: 20px 12px;
            flex: 1;
            overflow-y: auto;
        }

        .dir-item {
            padding: 8px 12px;
            margin-bottom: 2px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #2c3b4c;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 14px;
        }

        .dir-item:hover {
            background: #f0f6ff;
            color: #1e40af;
        }

        .dir-item .item-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
        }

        .dir-item .item-icon svg {
            width: 18px;
            height: 18px;
            stroke: #5a6b7c;
            stroke-width: 1.6;
            fill: none;
            transition: stroke 0.15s;
        }

        .dir-item:hover .item-icon svg {
            stroke: #2563eb;
        }

        .dir-item.active {
            background: #e9f2ff;
            color: #1d4ed8;
            font-weight: 500;
        }

        .dir-item.active .item-icon svg {
            stroke: #2563eb;
        }

        /* 右侧展示内容 */
        .preview-content {
            padding: 24px 20px;
            flex: 1;
            overflow-y: auto;
            font-size: 14px;
            color: #253544;
        }

        .preview-card {
            background: #f8fcff;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid #e2ebf5;
            box-shadow: 0 2px 6px rgba(0,27,55,0.03);
        }

        .preview-card h4 {
            margin-bottom: 14px;
            color: #173553;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            font-size: 15px;
        }

        .preview-card h4 svg {
            width: 18px;
            height: 18px;
            stroke: #3b6e9c;
            stroke-width: 1.8;
            fill: none;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #dde5ed;
            color: #3f5369;
        }

        .stat-item strong {
            color: #1d4a77;
            font-weight: 600;
        }

        .badge {
            background: #e3efff;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            color: #1d4ed8;
            border: 1px solid #b9d6ff;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .badge svg {
            width: 14px;
            height: 14px;
            stroke: #1d4ed8;
            stroke-width: 2;
        }

        /* 中央编辑器内容 */
        .editor-content {
            flex: 1;
            padding: 28px 32px;
            overflow-y: auto;
        }

        textarea {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            resize: none;
            font-size: 16px;
            line-height: 1.7;
            color: #1f2a3c;
            padding: 12px 8px;
        }

        textarea::placeholder {
            color: #9bb0c4;
            font-weight: 300;
        }

        /* 折叠状态调整 - 修复折叠后按钮始终可见 */
        .sidebar-left.collapsed .left-header,
        .sidebar-right.collapsed .right-header {
            justify-content: center;
            padding: 0 8px;
        }

        .sidebar-left.collapsed .header-title .icon-wrapper svg,
        .sidebar-right.collapsed .header-title .icon-wrapper svg {
            stroke: #4b6a8c;
        }

        /* 确保折叠按钮在任何状态下都完全可见且可点击 */
        .sidebar-left.collapsed .fold-btn,
        .sidebar-right.collapsed .fold-btn {
            opacity: 1 !important;
            pointer-events: auto !important;
            display: flex !important;
        }

        /* 确保头部标题区域的文字在折叠时隐藏，但不影响按钮 */
        .sidebar-left.collapsed .header-title span:not(.fold-btn),
        .sidebar-right.collapsed .header-title span:not(.fold-btn) {
            opacity: 0;
            pointer-events: none;
            width: 0;
            display: none;
        }

        /* 修复折叠后图标容器可能影响点击的问题 */
        .sidebar-left.collapsed .header-title,
        .sidebar-right.collapsed .header-title {
            gap: 0;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #b8ccdd;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<!-- 左侧目录栏 -->

            </span>

        <div class="dir-item">
            <span class="item-icon">

                    <line x1="15" y1="9" x2="9" y2="15"/>
                </svg>
            </span>
            <span>插件生态</span>
        </div>
        <div class="dir-item">
            <span class="item-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 16v-4M12 8h.01"/>
                </svg>
            </span>
            <span>常见问题</span>
        </div>
        <div class="dir-item">
            <span class="item-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M12 8v8M8 12h8"/>
                    <circle cx="12" cy="12" r="10"/>
                </svg>
            </span>
            <span>更新日志</span>
        </div>
        <div style="margin-top: 24px; border-top: 1px solid #e2ebf5; padding-top: 16px;">
            <div class="dir-item">
                <span class="item-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <rect x="3" y="3" width="8" height="8" rx="1"/>
                        <rect x="13" y="3" width="8" height="8" rx="1"/>
                        <rect x="3" y="13" width="8" height="8" rx="1"/>

            </div>
        </div>
    </div>
</div>

<!-- 中央文本编辑区 -->
<div class="main-editor">
    <div class="editor-header">
        <div class="header-title">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                </svg>
            </div>
            <span>草稿：三栏布局笔记</span>
        </div>
        <div style="color:#56789a; font-size:13px; background: #ecf3fa; padding:6px 16px; border-radius:40px; display:flex; align-items:center; gap:6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3b6e9c" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 6v6l4 2"/>
            </svg>
            <span>编辑中</span>
        </div>
    </div>
    <div class="editor-content">
        <textarea placeholder="在这里撰写你的内容… 左右侧边栏均可通过头部按钮折叠。

✅ 折叠功能已修复：现在点击左右两侧的三点图标，侧边栏可以正常展开和收起。

左侧目录栏使用精致的线性图标，右侧展示面板也搭配了简约的线条元素。">
        </textarea>
    </div>
</div>

<!-- 右侧展示栏 -->
<div class="sidebar-right" id="sidebarRight">
    <div class="right-header">
        <div class="header-title">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="9" y1="9" x2="15" y2="15"/>
                    <line x1="15" y1="9" x2="9" y2="15"/>
                </svg>
            </div>
            <span>展示面板</span>
        </div>
        <div class="fold-btn" id="toggleRightBtn" title="折叠右侧面板">
            <div class="icon-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>
    <div class="preview-content">
        <div class="preview-card">
            <h4>
                <svg viewBox="0 0 24 24" stroke="currentColor">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                当前统计
            </h4>
            <div class="stat-item"><span>文档字数</span> <strong>286</strong></div>
            <div class="stat-item"><span>段落</span> <strong>9</strong></div>
            <div class="stat-item"><span>阅读时间</span> <strong>≈1.5分钟</strong></div>
        </div>
        <div class="preview-card">
            <h4>
                <svg viewBox="0 0 24 24" stroke="currentColor">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
                目录预览
            </h4>
            <div style="margin-bottom:10px; display:flex; align-items:center; gap:8px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3b6e9c" stroke-width="2"><circle cx="12" cy="12" r="2"/></svg>
                <span>简介与快速开始</span>
                <span style="margin-left:auto; color:#56789a;">当前</span>
            </div>
            <div style="margin-bottom:10px; display:flex; align-items:center; gap:8px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6f8faf" stroke-width="2"><circle cx="12" cy="12" r="2"/></svg>
                <span>安装指南</span>
            </div>
            <div style="margin-bottom:10px; display:flex; align-items:center; gap:8px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6f8faf" stroke-width="2"><circle cx="12" cy="12" r="2"/></svg>
                <span>核心概念</span>
            </div>
        </div>
        <div class="badge">
            <svg viewBox="0 0 24 24" stroke="currentColor">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 16v-4M12 8h.01"/>
            </svg>
            折叠功能已修复
        </div>
    </div>
</div>

<script>
    (function() {
        const leftSidebar = document.getElementById('sidebarLeft');
        const rightSidebar = document.getElementById('sidebarRight');
        const toggleLeftBtn = document.getElementById('toggleLeftBtn');
        const toggleRightBtn = document.getElementById('toggleRightBtn');

        console.log('按钮元素:', toggleLeftBtn, toggleRightBtn); // 调试用

        // 左侧折叠/展开 - 确保事件绑定正确
        if (toggleLeftBtn) {
            toggleLeftBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('左侧按钮被点击');
                leftSidebar.classList.toggle('collapsed');
                updateTooltips();
            });
        }

        // 右侧折叠/展开
        if (toggleRightBtn) {
            toggleRightBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('右侧按钮被点击');
                rightSidebar.classList.toggle('collapsed');
                updateTooltips();
            });
        }

        // 目录项点击active效果
        const dirItems = document.querySelectorAll('.dir-item');
        dirItems.forEach(item => {
            item.addEventListener('click', function(e) {
                e.stopPropagation();
                dirItems.forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });

        function updateTooltips() {
            if (toggleLeftBtn) {
                toggleLeftBtn.title = leftSidebar.classList.contains('collapsed') ? '展开左侧目录' : '折叠左侧目录';
            }
            if (toggleRightBtn) {
                toggleRightBtn.title = rightSidebar.classList.contains('collapsed') ? '展开右侧面板' : '折叠右侧面板';
            }
        }
        updateTooltips();

        // 额外：确保折叠按钮始终可点击（CSS已保证）
    })();
</script>

</body>
</html>
